# Desenvolvimento: apenas o PostgreSQL. `docker compose up -d db`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saturbank
    ports: ["5432:5432"]
    volumes:
      - dados:/var/lib/postgresql/data
      - ./scripts/criar-bancos-teste.sql:/docker-entrypoint-initdb.d/01-testes.sql:ro
volumes:
  dados:
